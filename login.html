<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — StoryMind</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
    body {
        background:
            radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.10), transparent 60%),
            radial-gradient(1000px 500px at 110% 110%, rgba(236,72,153,.08), transparent 60%),
            var(--bg, #f8fafc);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .box {
        background: var(--card, #fff);
        border: 1px solid var(--line, #e2e8f0);
        border-radius: 18px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow:
            0 1px 2px rgba(0,0,0,.04),
            0 12px 32px -12px rgba(15,23,42,.18);
        animation: fade-in .35s ease;
    }
    @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .box h2 {
        font-size: 1.5rem;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .box h2 .logo-dot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px; height: 32px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: white;
        border-radius: 10px;
        font-size: .9rem;
    }
    .box label {
        display: block;
        font-size: .8rem;
        font-weight: 600;
        color: var(--mut, #64748b);
        text-transform: uppercase;
        letter-spacing: .04em;
        margin: 16px 0 6px;
    }
    .box input:not([type="checkbox"]) {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--line, #e2e8f0);
        background: var(--bg, #f8fafc);
        color: var(--tx, #0f172a);
        font: inherit;
        transition: border-color .15s, box-shadow .15s;
    }
    .box input:not([type="checkbox"]):focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99,102,241,.15);
    }
    .btn-primary {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        border: 0;
        border-radius: 10px;
        font-weight: 600;
        font-size: .95rem;
        cursor: pointer;
        transition: transform .12s, box-shadow .15s;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -8px rgba(99,102,241,.55);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
        width: 100%;
        margin-top: 10px;
        padding: 11px;
        background: transparent;
        border: 1px solid var(--line, #e2e8f0);
        border-radius: 10px;
        color: var(--tx, #0f172a);
        font-weight: 600;
        font-size: .9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background .12s, border-color .12s;
    }
    .btn-ghost:hover {
        background: var(--bg, #f8fafc);
        border-color: #cbd5e1;
    }
    #msg {
        margin-top: 14px;
        font-size: .85rem;
        text-align: center;
        min-height: 1.2em;
        color: var(--mut, #64748b);
    }
    #msg.error { color: #dc2626; }
    #msg.success { color: #059669; }
    .hint {
        text-align: center;
        margin-top: 20px;
        font-size: .78rem;
        color: var(--mut, #94a3b8);
    }
    .hint kbd {
        background: var(--line, #e2e8f0);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: .75rem;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/auth.js"></script></head>
<body>

<div class="box">
    <a href="index.html" class="mut" style="font-size:.85rem">← Início</a>

    <h2 style="margin-top:14px">
        <span class="logo-dot"><i class="fa-solid fa-brain"></i></span>
        Entrar
    </h2>
    <p class="mut" style="margin-bottom:6px;font-size:.9rem">Suas histórias ficam salvas na sua conta.</p>

    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" autofocus>

    <label for="pw">Senha</label>
    <input id="pw" type="password" placeholder="mínimo 6 caracteres" autocomplete="current-password">

    <button class="btn-primary" id="in">Entrar</button>
    <button class="btn-ghost" id="up">Criar conta</button>

    <p id="msg" class="mut"></p>
    <p class="hint">Pressione <kbd>Enter</kbd> para entrar rapidamente.</p>
</div>

<script>
    SM_AUTH.redirectIfLogged();

    const $ = id => document.getElementById(id);
    const msg = (t, kind = '') => {
        const el = $('msg');
        el.textContent = t;
        el.className = 'mut ' + kind;
    };
    const val = () => ({ e: $('email').value.trim(), p: $('pw').value });

    // ---- Submit por botão ----
    $('in').onclick = async () => {
        const { e, p } = val();
        if (!e || !p) { msg('Preencha e-mail e senha.', 'error'); return; }
        msg('Entrando…');
        const { error } = await SM_AUTH.signIn(e, p);
        if (error) { msg('Erro: ' + error.message, 'error'); return; }
        location.href = 'dashboard.html';
    };

    // ---- Submit por Enter (email → foca senha / senha → entra) ----
    $('email').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); $('pw').focus(); }
    });
    $('pw').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); $('in').click(); }
    });

    // ---- Criar conta ----
    $('up').onclick = async () => {
        const { e, p } = val();
        if (!e || !p) { msg('Preencha e-mail e senha.', 'error'); return; }
        msg('Criando conta…');
        const { data, error } = await SM_AUTH.signUp(e, p);
        if (error) return msg('Erro: ' + error.message, 'error');
        data.session
            ? location.href = 'dashboard.html'
            : msg('Conta criada! Confirme o e-mail que enviamos e depois clique em Entrar.', 'success');
    };
</script>
</body></html>
